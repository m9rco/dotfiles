name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # 手动触发，便于在不改代码的情况下重跑
  workflow_dispatch:

# 同一分支的新 push 取消旧的运行 —— 省 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ 静态检查
  #
  # 单独一个 job：它最快，失败时其他 job 的结果就不重要了。
  lint:
    name: lint (shellcheck + shfmt + conventions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # shfmt 走官方发布二进制：apt 里的版本太旧，格式规则与本地不一致
          SHFMT_VERSION=v3.10.0
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version | head -2
          shfmt --version

      - name: Lint
        run: sh test/lint.sh

      - name: Install PowerShell
        run: |
          # Ubuntu 上装 pwsh 以便跑 PowerShell 侧的语法与静态检查。
          # Windows 特有的行为（注册表、winget）由 windows job 验证。
          sudo apt-get install -y -qq wget apt-transport-https software-properties-common
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm -f packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell
          pwsh --version

      - name: Install PSScriptAnalyzer
        run: pwsh -NoProfile -Command "Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck"

      - name: Lint PowerShell
        run: sh test/lint_ps.sh

      - name: Spec coverage is complete
        run: |
          # 每条 spec requirement 都必须映射到实现与验证方式。
          # 这条检查也会校验映射表本身没有引用已不存在的文件 ——
          # 一张说谎的追溯表比没有表更糟。
          sh test/spec_coverage.sh --check

  # ------------------------------------------------------------------ 密钥扫描
  #
  # 这个仓库是公开的，一次泄露就是永久泄露。CI 上扫全库（不只是暂存区），
  # 因为 pre-commit 守卫只能防住装了 gitleaks 的机器。
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 扫历史需要完整克隆
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner --verbose

      - name: Scan full history
        run: gitleaks git . --redact --no-banner

  # ------------------------------------------------------------------ 测试矩阵
  test:
    name: test (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台失败不取消其他平台 —— 需要看到完整的失败面
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # POSIX 兼容性靠 dash 把关：bootstrap.sh 必须能在它下面跑
        shell: [sh, dash]
    steps:
      - uses: actions/checkout@v4

      - name: Install dash
        if: matrix.shell == 'dash' && runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash

      - name: Install dash (macOS)
        if: matrix.shell == 'dash' && runner.os == 'macOS'
        run: brew install dash

      - name: Install gitleaks
        # 测试里有真实的 pre-commit 守卫用例，需要 gitleaks。
        # 装固定版本而不依赖 runner 镜像自带的 —— 镜像里的版本可能旧到
        # 用 detect/protect 而非 dir/git（实测 ubuntu runner 就是），
        # 那会让守卫测试以难以理解的方式失败。
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install gitleaks
          else
            GITLEAKS_VERSION=8.30.1
            curl -fsSL -o /tmp/gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo mv /tmp/gitleaks /usr/local/bin/
          fi
          gitleaks version

      - name: Run the test suites
        run: DOT_TEST_SHELL=${{ matrix.shell }} sh test/run_all.sh

  # ------------------------------------------------------------------ 引导冒烟
  #
  # 测试套件用替身验证行为；这里验证真实入口能在真实环境里跑通。
  smoke:
    name: bootstrap smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: --info prints platform detection
        run: |
          ./bootstrap.sh --info
          # 探测结果必须完整；缺项说明某条探测路径在这个平台上断了
          for key in DOT_OS DOT_ARCH DOT_PKG DOT_WSL DOT_HEADLESS; do
            ./bootstrap.sh --info | grep -q "^${key} " || {
              echo "missing detection output: ${key}"
              exit 1
            }
          done

      - name: CI is detected as headless
        run: |
          # CI 上必须是 headless，否则字体等 GUI 模块会被误执行
          ./bootstrap.sh --info | grep -qE '^DOT_HEADLESS +1' || {
            echo 'DOT_HEADLESS should be 1 in CI'
            ./bootstrap.sh --info
            exit 1
          }

      - name: --list shows modules
        run: ./bootstrap.sh --list

      - name: --help is generated from disk
        run: ./bootstrap.sh --help

      - name: --dry-run touches nothing
        run: |
          before=$(find "$HOME" -maxdepth 2 2>/dev/null | sort | shasum | cut -d' ' -f1)
          ./bootstrap.sh --dry-run
          after=$(find "$HOME" -maxdepth 2 2>/dev/null | sort | shasum | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo 'dry-run modified $HOME — that must never happen'
            exit 1
          fi

      - name: --dry-run for every tag
        run: |
          # 每个标签都要能规划出来，不能有模块在某个标签下崩掉
          for tag in $(./bootstrap.sh --help | sed -n 's/^Available tags: //p'); do
            echo "--- tag: $tag ---"
            ./bootstrap.sh --dry-run --tag "$tag"
          done

      - name: unknown module exits non-zero
        run: |
          if ./bootstrap.sh --only definitely-not-a-module >/dev/null 2>&1; then
            echo 'unknown module should have failed'
            exit 1
          fi


  # ------------------------------------------------------------------ Windows
  #
  # 真实 Windows runner —— PowerShell 侧的代码只有在这里才算被验证过。
  # 本地 macOS 上能跑 pwsh，但拿不到注册表、winget、真实的 LOCALAPPDATA。
  windows:
    name: windows (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell versions available
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          # 5.1 也必须能跑 —— 那是 Windows 自带的版本，引导不能假设 7 已装好
          powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Lint (syntax + PSScriptAnalyzer + smoke)
        shell: bash
        run: sh test/lint_ps.sh

      - name: -Info under PowerShell 5.1
        shell: powershell
        run: |
          # 同上：要拿退出码必须走独立进程。在会话内直接调用时
          # $LASTEXITCODE 不反映脚本的 exit，这条检查会形同虚设。
          #
          # 这一步是 5.1 兼容性的关键验证 —— Windows 自带的就是 5.1，
          # 引导不能假设 PowerShell 7 已存在。
          & powershell -NoProfile -File .\bootstrap.ps1 -Info
          $rc = $LASTEXITCODE
          Write-Output "exit code was: $rc"
          if ($rc -ne 0) {
            Write-Error 'bootstrap.ps1 -Info failed under PowerShell 5.1'
            exit 1
          }

      - name: -Info reports every detection key
        shell: pwsh
        run: |
          $out = .\bootstrap.ps1 -Info
          foreach ($key in @('DOT_OS', 'DOT_ARCH', 'DOT_PKG', 'DOT_WSL', 'DOT_HEADLESS')) {
            if (-not ($out | Select-String -Pattern "^$key ")) {
              Write-Error "missing detection output: $key"
              exit 1
            }
          }
          # CI 上必须是 headless，否则 GUI 模块会被误执行
          if (-not ($out | Select-String -Pattern '^DOT_HEADLESS\s+1')) {
            Write-Error 'DOT_HEADLESS should be 1 in CI'
            exit 1
          }

      - name: -List and -Help
        shell: pwsh
        run: |
          .\bootstrap.ps1 -List
          .\bootstrap.ps1 -Help

      - name: -DryRun writes nothing
        shell: pwsh
        run: |
          $before = (Get-ChildItem -Path $env:USERPROFILE -Force | Measure-Object).Count
          .\bootstrap.ps1 -DryRun
          $after = (Get-ChildItem -Path $env:USERPROFILE -Force | Measure-Object).Count
          if ($before -ne $after) {
            Write-Error "dry-run changed the profile directory ($before -> $after)"
            exit 1
          }

      - name: unknown module exits non-zero
        shell: pwsh
        run: |
          # 必须作为**独立进程**调用才能拿到退出码。
          # `shell: pwsh` 下直接 `.\bootstrap.ps1` 是在当前会话里执行，
          # 脚本里的 exit 1 会结束整个 shell，而 $LASTEXITCODE 只反映
          # 外部进程的退出码 —— 于是这条断言永远看到 0（实测如此）。
          & pwsh -NoProfile -File .\bootstrap.ps1 -Only definitely-not-a-module 2>$null
          $rc = $LASTEXITCODE
          Write-Output "exit code was: $rc"
          if ($rc -eq 0) {
            Write-Error 'unknown module should have exited non-zero'
            exit 1
          }
          # 必须显式 exit 0。GitHub 的 pwsh 包装器在步骤结束时会看
          # $LASTEXITCODE —— 这里它是被测命令留下的 1，步骤会被判为失败，
          # 尽管断言本身通过了。
          exit 0

      - name: link primitive backs up existing files
        shell: pwsh
        run: |
          # 这是 Windows 侧最关键的一条：链接前必须备份，绝不销毁用户内容
          $sandbox = Join-Path $env:RUNNER_TEMP 'linktest'
          New-Item -ItemType Directory -Path "$sandbox\home" -Force | Out-Null
          New-Item -ItemType Directory -Path "$sandbox\repo" -Force | Out-Null
          Set-Content -Path "$sandbox\repo\rc" -Value 'REPO CONTENT'
          Set-Content -Path "$sandbox\home\.rc" -Value 'USER CONTENT WORTH KEEPING'

          $env:DOT_HOME = "$sandbox\home"
          $env:DOT_BACKUP_ROOT = "$sandbox\backup"
          . .\lib\windows.ps1
          $script:DotDryRun = $false
          New-DotLink -Source "$sandbox\repo\rc" -Target "$sandbox\home\.rc" | Out-Null

          if (-not (Test-DotSymlink "$sandbox\home\.rc")) {
            Write-Error 'target did not become a link'
            exit 1
          }
          $backed = Get-ChildItem -Path "$sandbox\backup" -Recurse -File | Select-Object -First 1
          if (-not $backed) {
            Write-Error 'the pre-existing file was NOT backed up'
            exit 1
          }
          if ((Get-Content $backed.FullName -Raw).Trim() -ne 'USER CONTENT WORTH KEEPING') {
            Write-Error 'backup content does not match the original'
            exit 1
          }
          Write-Output "backed up to: $($backed.FullName)"

      - name: real install of the core modules
        shell: pwsh
        run: |
          # CI 是 headless，所以 GUI 模块（字体、Windows Terminal）应被跳过，
          # 其余应真正安装。这一步验证「跳过是有原因的」而不是静默失败。
          .\bootstrap.ps1 -Tag core
        continue-on-error: true

      - name: second run is idempotent
        shell: pwsh
        run: |
          $backupRoot = Join-Path $env:USERPROFILE '.dotfiles-backup'
          $before = if (Test-Path $backupRoot) { (Get-ChildItem $backupRoot -Directory).Count } else { 0 }
          .\bootstrap.ps1 -Tag core
          $after = if (Test-Path $backupRoot) { (Get-ChildItem $backupRoot -Directory).Count } else { 0 }
          if ($before -ne $after) {
            Write-Error "second run created a new backup dir ($before -> $after); not idempotent"
            exit 1
          }
        continue-on-error: true

  # ------------------------------------------------------------------ 最小容器
  #
  # 真实安装的可移植性验证。debian:stable-slim 的 /bin/sh 是 dash，
  # 且几乎什么都没预装 —— 能在这里跑通，才说明引导没有隐式依赖。
  container:
    name: real install in a minimal container
    runs-on: ubuntu-latest
    container:
      image: debian:stable-slim
    steps:
      - name: Install the bare minimum
        run: |
          apt-get update -qq
          # 只装引导本身声明需要的：git 用于 checkout，curl/ca-certificates 用于下载
          apt-get install -y -qq git curl ca-certificates
          # 确认 /bin/sh 真的是 dash —— 这是本 job 的意义所在
          ls -l /bin/sh

      - uses: actions/checkout@v4

      - name: Trust the checkout directory
        run: |
          # 容器里的用户与 checkout 的属主不同，git 会拒绝操作并报
          # "detected dubious ownership" —— 迁移断言里的 git submodule status
          # 因此拿到错误信息而非空输出。
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$(pwd)"

      - name: Detection works with nothing preinstalled
        run: |
          ./bootstrap.sh --info
          ./bootstrap.sh --info | grep -qE '^DOT_OS +linux'
          ./bootstrap.sh --info | grep -qE '^DOT_PKG +apt'

      - name: Test suites pass under dash
        run: sh test/run_all.sh

      - name: Real install of the essential modules
        run: |
          # 这个 job 要证明的是「引导在最小环境里能跑通」，不是
          # 「每个工具都能装上」。debian stable 的仓库里没有 eza / delta /
          # lazygit / gh / yq / starship。其中 lazygit / gh / yq 现在会去拉
          # GitHub release 的预编译二进制（容器里有 curl），starship 走它的
          # 官方脚本；真正装不上的只剩 eza 与 delta —— 容器里没有 cargo。
          #
          # 所以只对不依赖第三方仓库的模块断言成功：zsh 与 git。
          # modern-cli 的部分失败单独验证（下一步）。
          ./bootstrap.sh --only zsh,git

      - name: modern-cli degrades gracefully
        run: |
          # 装不上的工具必须被逐个点名、其余照常装上、且不因此让引导失败。
          #
          # 最后这点是刻意的语义：上面那步的注释已经承认「那几个装不上是
          # 环境的真实约束，不是缺陷」，那就不该让整台机器的引导非零退出。
          # 现在只有 essential 工具（目前只有 starship，因为它是 prompt）
          # 失败才致命，而 starship 有官方脚本兜底、拉预编译二进制，
          # 容器里装了 curl 所以它应该装上。
          set +e
          out=$(./bootstrap.sh --only modern-cli 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          # 至少要装上一部分（debian 仓库里有 ripgrep/fd/bat/fzf/zoxide/jq）
          echo "$out" | grep -q 'installed/present: [1-9]' || {
            echo 'expected at least one tool to install'
            exit 1
          }
          # 失败的工具必须被点名。
          #
          # 这条现在只剩 eza 与 delta 撑着（都只有 cargo 回退，而容器里
          # 没有 cargo）。lazygit/gh/yq 从前也在这个集合里，现在走 GitHub
          # release 装上了 —— 所以别把这条当成「总有工具会失败」的证明，
          # 它证的是「失败的会被点名」。
          echo "$out" | grep -q 'could not install' || {
            echo 'expected the unavailable tools to be named'
            exit 1
          }
          # 仓库里没有、但有预编译二进制的那几个必须真的装上了 ——
          # 这是 github: 回退在真实容器里的端到端证明。
          for tool in lazygit gh yq; do
            echo "$out" | grep -q "installed $tool via GitHub release" || {
              echo "$tool should have installed from its GitHub release"
              exit 1
            }
          done
          # 非必需工具装不上不该影响退出码
          if [ "$rc" != 0 ]; then
            echo "non-essential failures must not fail the module (exit $rc)"
            echo 'if an essential tool genuinely failed, the output above names it'
            exit 1
          fi
          # starship 是 essential，必须真的装上了（走官方脚本）。
          #
          # 不能用 command -v 判断：官方脚本装到 ~/.local/bin，而引导进程
          # 对 PATH 的修改不会传给 CI 的下一条命令（那是新 shell）。
          # 用户侧不是问题 —— 10-path.zsh 里有 ~/.local/bin，新 shell 能找到；
          # 引导也会提示需要重开终端。这里直接查文件在不在。
          if ! command -v starship >/dev/null && [ ! -x "$HOME/.local/bin/starship" ]; then
            echo 'starship is essential and should have installed via its official script'
            exit 1
          fi
          # 装完必须提示 PATH 的事 —— 否则用户会以为装失败了
          echo "$out" | grep -q 'open a new shell' || {
            echo 'expected a notice that new tools need a fresh shell for PATH'
            exit 1
          }
          echo "modern-cli degraded gracefully (exit $rc, starship present)"

      - name: an essential failure does fail the module
        run: |
          # 反面用例：把一个必然装不上的工具标成 essential，模块必须失败。
          # 没有这条，上一步的「退出码 0」可以靠「永远不失败」来满足 ——
          # 那就把致命性分级测成了空壳。
          tmp=$(mktemp -d)
          mkdir -p "$tmp/cli"
          cp -r config/* "$tmp/" 2>/dev/null || true
          printf '%s\n' 'definitely-not-a-real-package|all|essential||canary' \
            >"$tmp/cli/tools.txt"
          set +e
          out=$(DOT_CONFIG_DIR="$tmp" ./bootstrap.sh --only modern-cli 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" = 0 ]; then
            echo 'an essential tool failing must make the module fail'
            exit 1
          fi
          echo "$out" | grep -q 'essential:' || {
            echo 'the output must single out which tools were essential'
            exit 1
          }
          echo "essential failures are fatal (exit $rc)"

      - name: Installed state is correct
        run: |
          test -L "$HOME/.zshrc" || { echo '.zshrc was not linked'; exit 1; }
          test -L "$HOME/.gitconfig" || { echo '.gitconfig was not linked'; exit 1; }
          command -v zsh >/dev/null || { echo 'zsh was not installed'; exit 1; }
          # zsh 必须能在没有 oh-my-zsh 的情况下正常启动
          zsh -i -c 'echo zsh starts cleanly' </dev/null

      - name: Second run is idempotent
        run: |
          # 记录首次安装后的备份目录数量
          before=$(find "$HOME/.dotfiles-backup" -maxdepth 1 -type d 2>/dev/null | wc -l)
          ./bootstrap.sh --only zsh,git
          after=$(find "$HOME/.dotfiles-backup" -maxdepth 1 -type d 2>/dev/null | wc -l)
          if [ "$before" != "$after" ]; then
            echo "second run created a new backup dir ($before -> $after); not idempotent"
            exit 1
          fi

      - name: Existing user files are backed up, never destroyed
        run: |
          rm -f "$HOME/.zshrc"
          printf 'USER CONTENT WORTH KEEPING\n' > "$HOME/.zshrc"
          ./bootstrap.sh --only zsh
          # 原文件必须能在备份里逐字节找回
          found=$(grep -rl 'USER CONTENT WORTH KEEPING' "$HOME/.dotfiles-backup" 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo 'the pre-existing .zshrc was not backed up'
            exit 1
          fi
          echo "backed up to: $found"

  # ------------------------------------------------------------------ RHEL 族
  #
  # 真实的 RHEL 族验证。debian 容器覆盖不到 dnf/yum 与 EPEL 这条路径，
  # 而那条路径上的包名只能靠实测 —— 按命名习惯推测会错，而且错得很安静：
  # 包名写错时 dnf 报 "No match for argument"，代码把它当成「仓库里没这个包」
  # 转去走回退链，症状与「包确实不存在」完全一样。
  #
  # 这个 job 是补写的，因为前一轮 yum 支持全靠替身 yum 验证，
  # 而替身对 install 一律返回成功 —— 三处包名错误（gh 写成 github-cli、
  # yq 该有却返回空、direnv 当成到处都有）在模拟环境里全部测不出来。
  rhel-container:
    name: real install on RHEL-family (dnf + EPEL)
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - name: Install the bare minimum
        run: |
          # 只装缺的。不能无条件 `dnf install curl` —— x86_64 的 rockylinux:9
          # 预装了 curl-minimal，而它与完整 curl 包冲突，dnf 会直接报
          # "conflicts with curl provided by ..." 并退出。
          # curl-minimal 已经提供 /usr/bin/curl，够用。
          # （arm64 镜像层不同、没有这个冲突，所以本机测不出来。）
          command -v curl >/dev/null || dnf install -y -q curl
          command -v git >/dev/null || dnf install -y -q git
          curl --version | head -1
          git --version

      - uses: actions/checkout@v4

      - name: Trust the checkout directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$(pwd)"

      - name: Detection identifies RHEL family
        run: |
          ./bootstrap.sh --info
          ./bootstrap.sh --info | grep -qE '^DOT_DISTRO +rhel'
          # Rocky 9 有 dnf，所以必须选 dnf 而不是 yum shim
          ./bootstrap.sh --info | grep -qE '^DOT_PKG +dnf'

      - name: Test suites pass here too
        run: sh test/run_all.sh

      - name: EPEL is enabled and the tools it provides install from the repo
        run: |
          set +e
          out=$(./bootstrap.sh --only modern-cli 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          # EPEL 必须被启用 —— base 仓库里没有这些工具
          echo "$out" | grep -q 'EPEL' || {
            echo 'expected EPEL to be enabled on a RHEL-family system'
            exit 1
          }

          # 这些包在 Rocky 9 + EPEL 9 里确实存在（实测过），所以必须
          # 从仓库装上，而不是退化成源码编译。任一走了回退都说明包名写错了。
          #
          # fzf/jq/yq/gh 现在同时声明了 github: 回退 —— 这几行因此还兼任
          # 另一个角色：证明预编译二进制**没有抢走**仓库里本来有的包。
          # 回退只能在包管理器失败之后才轮到。
          for tool in ripgrep fd bat fzf zoxide delta jq yq gh tmux; do
            echo "$out" | grep -qE "installed $tool via dnf" || {
              echo "$tool should have installed from the repo (package name wrong?)"
              exit 1
            }
          done

          # starship 不在 RHEL 仓库里，走官方脚本（预编译二进制）
          echo "$out" | grep -q 'installed starship via install script' || {
            echo 'starship should have installed via its official script'
            exit 1
          }

          # lazygit 与 direnv 在 Rocky 9 的任何仓库里都没有，但两个项目都发
          # 预编译二进制 —— 这是 github: 回退存在的理由，也是它在 RHEL 上的
          # 端到端证明。
          for tool in lazygit direnv; do
            echo "$out" | grep -q "installed $tool via GitHub release" || {
              echo "$tool should have installed from its GitHub release"
              exit 1
            }
          done

          # eza 在 Rocky 9 的任何仓库里都没有，也没有预编译二进制可用
          # （只有 cargo）—— 装不上是环境的真实约束，不该让引导失败
          if [ "$rc" != 0 ]; then
            echo "non-essential failures must not fail the module (exit $rc)"
            exit 1
          fi
          echo "modern-cli succeeded on RHEL family (exit $rc)"

      - name: EPEL is not re-enabled on a second run
        run: |
          out=$(./bootstrap.sh --only modern-cli 2>&1)
          printf '%s\n' "$out"
          # 已启用时不该再装 epel-release
          if echo "$out" | grep -q 'enabling EPEL'; then
            echo 'EPEL should not be enabled twice'
            exit 1
          fi

      - name: DOT_NO_EPEL is honoured
        run: |
          # 换一个干净的 HOME，避免上一步装好的工具让判定失真
          out=$(DOT_NO_EPEL=1 ./bootstrap.sh --dry-run --only modern-cli 2>&1)
          printf '%s\n' "$out"
          if echo "$out" | grep -qi 'would enable EPEL'; then
            echo 'DOT_NO_EPEL=1 must skip EPEL entirely'
            exit 1
          fi

      - name: Real install of zsh and git
        run: |
          ./bootstrap.sh --only zsh,git
          test -L "$HOME/.zshrc" || { echo '.zshrc was not linked'; exit 1; }
          command -v zsh >/dev/null || { echo 'zsh was not installed'; exit 1; }
          zsh -i -c 'echo zsh starts cleanly' </dev/null
