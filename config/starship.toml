# starship prompt。zsh 与 PowerShell 共用这一份 —— 这是三平台
# prompt 完全一致的关键，也是选 starship 而非 omz 主题的原因。
#
# 设计取向：单行、不空行、信息按需出现、慢命令才显示耗时。
# 需要图标正常显示的前提是终端字体为 Nerd Font（见 modules/fonts）。
#
# prompt 的观感沿用旧配置里那个被改过的 omz 主题
# （legacy/private/zshrc/robbyrussell.zsh-theme）：🤥 用户名 🍭 时间 ➜。
# 那份主题只能给 zsh 用，这里用 starship 重建同样的外观，PowerShell 侧
# 因此也能拿到一致的 prompt。

# 模块顺序照旧主题的 PROMPT 排：➜ 在 cwd 之前、和它同一行，而不是
# starship 默认的「信息行 + 独立输入行」两行布局。$line_break 因此不出现。
format = """
$username\
$time\
$hostname\
$character\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration"""

# 旧主题的 prompt 之间不空行。starship 默认空一行，这里关掉 —— 单行 prompt
# 加空行会让每条命令占三行，翻屏时反而更难定位。
add_newline = false

# 命令超时才提示；短命令的耗时是噪音
[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

# 旧主题用 ➜ 的颜色区分上一条命令成功与否，这里保留这个约定。
# format 里 ➜ 排在 $directory 前面，所以符号后要自带一个空格 ——
# 各 symbol 内不加，统一由 format 补，避免改符号时忘掉间距。
[character]
format = "$symbol "
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"

# 旧主题的 git 段是 git:(分支)，脏工作区再跟一个 ✗：
#   ZSH_THEME_GIT_PROMPT_PREFIX="git:("  分支红色
#   ZSH_THEME_GIT_PROMPT_DIRTY=") ✗"     ✗ 黄色
# 这里逐段复刻。收尾的 ) 归给 git_branch（omz 里它在 DIRTY/CLEAN 上，
# 但那样 git_status 干净时就得负责输出一个括号，反而绕）。行尾空格也放
# git_branch：它在仓库里总会渲染，而 git_status 干净时整段为空，靠它补
# 空格会时有时无。
[git_branch]
symbol = ""
style = "bold blue"
# 括号要转义：starship 的 format 里 ( ) 是条件组语法，不转义会被当成
# 分组解析并让整个模块报错退化成空。
format = '[git:\(](bold blue)[$branch](red)[\)](bold blue) '

# ✗ 只表示「不干净」，不带数量 —— 与旧主题一致。
# 注意：多种状态同时存在时（比如既有改动又有未跟踪文件）会连着出现
# 多个 ✗，starship 没有「任意脏」的单一变量。想要区分度就把下面各项
# 换回 "!${count}" / "?${count}" 那种带计数的写法。
[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "✗"
untracked = "✗"
modified = "✗"
staged = "✗"
renamed = "✗"
deleted = "✗"
stashed = ""
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# 用户名无条件显示，🤥 前缀 —— 旧主题就是这么排的，是刻意保留的个人风格
# 而非信息需要。主机名仍然只在 SSH 下出现：本地机器上它是恒定的，
# 而用户名前缀已经占住了行首的视觉位置。
[username]
show_always = true
style_user = "bold cyan"
style_root = "bold red"
format = "[🤥 $user]($style) "

[hostname]
ssh_only = true
style = "bold green"
format = "[$hostname]($style) "

# 旧主题在用户名后面跟一个 🍭 和当前时间。starship 默认禁用 time 模块，
# 这里显式打开。%T 是 24 小时制的 HH:MM:SS，与旧主题的 %T 对齐。
[time]
disabled = false
time_format = "%T"
style = "bold yellow"
format = "[🍭 $time]($style) "

# 语言版本只在对应项目里出现
[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".nvmrc"]

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
only_with_files = true

# 默认关掉的模块：这些在本地开发里几乎不需要，且每个都要额外探测开销
[package]
disabled = true

[java]
disabled = true

[ruby]
disabled = true

[php]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true
