# starship prompt。zsh 与 PowerShell 共用这一份 —— 这是三平台
# prompt 完全一致的关键，也是选 starship 而非 omz 主题的原因。
#
# 设计取向：单行、信息按需出现、慢命令才显示耗时。
# 需要图标正常显示的前提是终端字体为 Nerd Font（见 modules/fonts）。

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# prompt 之间空一行，长输出后更易定位
add_newline = true

# 命令超时才提示；短命令的耗时是噪音
[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# 只在 SSH 会话里显示用户名与主机名 —— 本地机器上这两项是恒定的噪音。
# 旧配置无条件把 (whoami) 塞进 PROMPT，占了一整段宽度。
[username]
show_always = false
style_user = "bold yellow"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold green"
format = "[$hostname]($style) "

# 语言版本只在对应项目里出现
[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".nvmrc"]

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[rust]
symbol = " "
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
only_with_files = true

# 默认关掉的模块：这些在本地开发里几乎不需要，且每个都要额外探测开销
[package]
disabled = true

[java]
disabled = true

[ruby]
disabled = true

[php]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true
