theme: jekyll-theme-cayman

title: dotfiles
description: 跨 macOS / Linux / Windows 的开发环境配置

# 这是 dotfiles 仓库，不是网站：只发布 README.md 与 docs/。
# 其余目录都是脚本和 AI 配置，里面的 {% ... %} / {...} 是给人看的占位符，
# 交给 Liquid 解析会直接让 Pages 构建失败。
exclude:
  - bin
  - bootstrap.ps1
  - bootstrap.sh
  - config
  - legacy
  - lib
  - modules
  - openspec
  - platform
  - test
  - LICENSE
